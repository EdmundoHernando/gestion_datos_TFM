services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: gatvgatv
      MYSQL_DATABASE: prueba_medica
      MYSQL_USER: user
      MYSQL_PASSWORD: gatvgatv
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my_persistent_network

volumes:
  mysql_data:

networks:
  my_persistent_network:
    driver: bridge
